name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This repo is package.json-free by design (static GitHub Pages deploy).
      # Test-only deps installed transiently: dayjs (copy/paste suite) and
      # typescript (Stage D JSDoc type-check). Suites self-skip if either is
      # absent, so a failed install never turns into a false red — but we want
      # them present so the deterministic suites actually run in CI.
      - name: Install test-only dependencies
        run: npm install --no-save --no-package-lock dayjs@1.11.13 typescript@5.6.3
      - name: Run headless test suite
        run: node tools/run_tests.js
