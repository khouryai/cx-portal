name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guardrail: never deploy a build that fails syntax checks or the markup
      # engine tests. Catches regressions (e.g. the resize()/this.resize name
      # collision, onChange throw-on-mount) before they ever reach a device.
      - name: Verify (syntax + markup engine tests)
        run: |
          node --check app.js
          node --check markup.js
          node --check photos.js
          node --check sw.js
          node tools/markup_test.js
      # The same packaging step every environment uses (Azure, hand-off zip):
      # copies only what the browser needs into dist/ — no tests, SQL, infra
      # scripts or internal docs — and stamps the service worker's cache
      # version with this commit so clients always pick up the new build.
      - name: Build site
        run: node tools/build.js --version "cxp-${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - id: deployment
        uses: actions/deploy-pages@v4
