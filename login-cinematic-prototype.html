<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CX Portal — Cinematic Sign-In Prototype</title>
<style>
  :root{
    --red:#e60012; --red-2:#ff3b3b;
    --ink:#0a0c10;
    --glass:rgba(16,18,26,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#000;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}

  /* ---------- controls ---------- */
  .ui{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:6px;
    background:rgba(0,0,0,.5);backdrop-filter:blur(10px);padding:6px;border-radius:999px;
    border:1px solid rgba(255,255,255,.12)}
  .ui button{font:600 12px/1 inherit;color:#cbd5e1;background:transparent;border:0;padding:9px 15px;
    border-radius:999px;cursor:pointer}
  .ui button.on{background:var(--red);color:#fff}
  .ui .sep{width:1px;background:rgba(255,255,255,.14);margin:4px 2px}
  .ui small{align-self:center;color:#8b93a3;font-size:11px;padding:0 8px}

  /* ---------- stage ---------- */
  .stage{position:fixed;inset:0;overflow:hidden;background:#04060a}

  /* photographic layer — user drops real photos into assets/ */
  .shot{position:absolute;inset:-6%;background-size:cover;background-position:center;
    opacity:0;transition:opacity 1.6s ease;will-change:transform,opacity}
  .shot.show{opacity:1}
  .shot.kb{animation:ken 18s ease-in-out infinite alternate}
  @keyframes ken{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.18) translate(-2%,-1.5%)}}

  /* cinematic CSS fallback scene (shown when no photos present) */
  .cssscene{position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 70% 10%,#1b2a4a 0%,transparent 55%),
      radial-gradient(90% 70% at 20% 90%,#3a1020 0%,transparent 55%),
      linear-gradient(180deg,#070a12 0%,#0c1322 45%,#070a12 100%)}
  .cssscene::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px)}
  .glowline{position:absolute;left:-20%;width:140%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(120,180,255,.0),rgba(150,200,255,.7),rgba(120,180,255,0),transparent);
    filter:blur(.5px);opacity:.6}
  .glowline.a{top:58%;animation:rail 7s linear infinite}
  .glowline.b{top:62%;height:1px;opacity:.35;animation:rail 5s linear infinite}
  @keyframes rail{from{transform:translateX(-8%)}to{transform:translateX(8%)}}

  /* atmospheric overlays */
  .grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(3) infinite}
  @keyframes grain{to{transform:translate(-12px,8px)}}
  .vignette{position:absolute;inset:0;box-shadow:inset 0 0 240px 60px rgba(0,0,0,.8);pointer-events:none}
  /* dark color-grade applied on top of the real photo */
  .grade{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(4,7,14,.55) 0%,rgba(4,7,14,.25) 35%,rgba(4,7,14,.7) 100%),
      radial-gradient(120% 90% at 60% 30%,rgba(10,30,60,.25),rgba(2,4,8,.78) 80%);
    mix-blend-mode:multiply}
  .leak{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(40% 60% at 85% 15%,rgba(255,90,90,.18),transparent 60%),
               radial-gradient(45% 55% at 10% 85%,rgba(70,130,255,.16),transparent 60%);
    mix-blend-mode:screen;animation:breathe 9s ease-in-out infinite alternate}
  @keyframes breathe{from{opacity:.55}to{opacity:1}}

  /* ---------- the "train rush" dramatic intro ---------- */
  .rush{position:absolute;top:40%;left:-60%;width:60%;height:30%;pointer-events:none;z-index:30;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.05) 20%,rgba(180,210,255,.55) 50%,rgba(255,255,255,.9) 65%,rgba(255,255,255,.05) 90%,transparent);
    filter:blur(14px);opacity:0}
  .speedlines{position:absolute;inset:0;pointer-events:none;z-index:31;opacity:0;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 40px,rgba(255,255,255,.5) 40px 42px,rgba(255,255,255,0) 42px 120px);
    filter:blur(1px);mix-blend-mode:screen}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}

  body.run .rush{animation:rush 1.15s cubic-bezier(.4,0,.1,1) .35s 1 both}
  body.run .speedlines{animation:streak 1.0s cubic-bezier(.3,0,.1,1) .45s 1 both}
  body.run .flash{animation:flash 1.2s ease-out .55s 1 both}
  body.run .stage{animation:shake .5s ease-in-out .7s 1 both}
  @keyframes rush{0%{left:-60%;opacity:0}15%{opacity:1}80%{opacity:1}100%{left:115%;opacity:0}}
  @keyframes streak{0%{opacity:0;transform:translateX(-30%)}20%{opacity:.9}100%{opacity:0;transform:translateX(40%)}}
  @keyframes flash{0%{opacity:0}10%{opacity:.55}100%{opacity:0}}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}

  /* ambient pass — a soft light sweeps by every ~14s after intro */
  .ambient{position:absolute;top:35%;left:-40%;width:40%;height:40%;z-index:12;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(150,190,255,.10),rgba(255,255,255,.22),transparent);
    filter:blur(26px);opacity:0}
  body.live .ambient{animation:amb 14s linear 4s infinite}
  @keyframes amb{0%{left:-40%;opacity:0}10%{opacity:1}45%{opacity:1}60%{left:120%;opacity:0}100%{left:120%;opacity:0}}

  /* ---------- sign-in (static, dramatic reveal) ---------- */
  .center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none}
  .card{pointer-events:auto;width:400px;max-width:90vw;padding:40px 38px;border-radius:20px;
    background:var(--glass);backdrop-filter:blur(22px) saturate(140%);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18);
    opacity:0;transform:translateY(40px) scale(.96);filter:blur(8px)}
  body.run .card{animation:cardin 1.1s cubic-bezier(.16,1,.3,1) 1.15s 1 both}
  @keyframes cardin{to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}

  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:#9fb4d6;margin-bottom:16px}
  .kicker .pulse{width:7px;height:7px;border-radius:50%;background:var(--red);
    box-shadow:0 0 0 0 rgba(230,0,18,.6);animation:pp 2s ease-out infinite}
  @keyframes pp{0%{box-shadow:0 0 0 0 rgba(230,0,18,.55)}70%{box-shadow:0 0 0 12px rgba(230,0,18,0)}100%{box-shadow:0 0 0 0 rgba(230,0,18,0)}}
  .card h1{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-bottom:6px;
    background:linear-gradient(180deg,#fff,#c7d2e6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card .sub{font-size:13px;color:#9aa6bd;margin-bottom:26px}
  .field{position:relative;margin-bottom:16px}
  .field input{width:100%;font-size:14px;color:#fff;padding:14px 14px;border-radius:11px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);outline:none;transition:.2s}
  .field input::placeholder{color:#8b93a3}
  .field input:focus{border-color:var(--red);background:rgba(255,255,255,.09);
    box-shadow:0 0 0 4px rgba(230,0,18,.18)}
  .go{width:100%;font-size:14px;font-weight:800;letter-spacing:.02em;color:#fff;border:0;border-radius:11px;
    padding:15px;cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(120deg,var(--red),#ff5252);box-shadow:0 12px 30px rgba(230,0,18,.4)}
  .go::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    transform:skewX(-20deg);animation:sheen 3.4s ease-in-out infinite}
  @keyframes sheen{0%,55%{left:-120%}80%,100%{left:140%}}
  .go:hover{filter:brightness(1.08)}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px;color:#8b93a3}
  .row a{color:#b9c4da;text-decoration:none}

  /* staggered field reveal */
  body.run .stagger{opacity:0;transform:translateY(14px)}
  body.run .stagger{animation:rise .7s cubic-bezier(.16,1,.3,1) forwards}
  body.run .s1{animation-delay:1.35s}
  body.run .s2{animation-delay:1.47s}
  body.run .s3{animation-delay:1.59s}
  body.run .s4{animation-delay:1.71s}
  body.run .s5{animation-delay:1.83s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  /* parallax wrapper driven by mouse */
  .px{position:absolute;inset:0;transition:transform .25s ease-out;will-change:transform}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card{opacity:1;filter:none;transform:none}
    .shot.show{opacity:1}
  }
</style>
</head>
<body class="run live mood-night">

  <div class="ui">
    <button class="on" style="pointer-events:none">Cinematic night</button>
    <span class="sep"></span>
    <button id="replay">↻ Replay intro</button>
    <small>photos: <code style="color:#cbd5e1">assets/hsts-1.avif</code> &amp; <code style="color:#cbd5e1">assets/hsts-2.png</code></small>
  </div>

  <div class="stage" id="stage">
    <div class="px" id="px">
      <!-- Real BART photos. Drop these two files into an assets/ folder and
           they auto-replace the CSS scene with a Ken-Burns crossfade. -->
      <div class="shot kb" data-src="assets/hsts-1.avif"></div>
      <div class="shot kb" data-src="assets/hsts-2.png"></div>

      <div class="cssscene" id="cssscene">
        <div class="glowline a"></div><div class="glowline b"></div>
      </div>

      <!-- Dark cinematic grade over the photo: keeps the night mood and
           guarantees the glass card text stays readable. -->
      <div class="grade"></div>
      <div class="leak"></div>
    </div>

    <div class="ambient"></div>
    <div class="rush"></div>
    <div class="speedlines"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="flash"></div>
  </div>

  <div class="center">
    <form class="card" onsubmit="event.preventDefault();this.querySelector('.go').textContent='Signing in…';">
      <span class="kicker stagger s1"><span class="pulse"></span> CX Commissioning Portal</span>
      <h1 class="stagger s2">Welcome back.</h1>
      <p class="sub stagger s2">Secure access to the Bay Area transit commissioning workspace.</p>
      <div class="field stagger s3"><input type="email" placeholder="Work email" autocomplete="username"></div>
      <div class="field stagger s4"><input type="password" placeholder="Password" autocomplete="current-password"></div>
      <button class="go stagger s5" type="submit">Enter Portal</button>
      <div class="row stagger s5"><label><input type="checkbox" style="vertical-align:-1px"> Keep me signed in</label><a href="#">Forgot password?</a></div>
    </form>
  </div>

<script>
  // 1) Swap in real photos if the user has added them; otherwise keep the
  //    cinematic CSS scene. Each <div.shot> tries to load its data-src.
  (function(){
    const shots=[...document.querySelectorAll('.shot')];
    let loaded=0, idx=0;
    shots.forEach(s=>{
      const img=new Image();
      img.onload=()=>{ s.style.backgroundImage=`url('${s.dataset.src}')`; s.dataset.ok="1"; loaded++;
        if(loaded===1){ document.getElementById('cssscene').style.display='none'; cycle(); } };
      img.onerror=()=>{};               // silently fall back to CSS scene
      img.src=s.dataset.src;
    });
    function cycle(){
      const ok=shots.filter(s=>s.dataset.ok);
      if(!ok.length) return;
      ok.forEach((s,i)=>s.classList.toggle('show', i===idx%ok.length));
      idx++; setTimeout(cycle, 6000);
    }
  })();

  // 2) Subtle mouse parallax — the scene drifts opposite the cursor.
  const px=document.getElementById('px');
  window.addEventListener('pointermove',e=>{
    const x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
    px.style.transform=`translate(${x*-26}px,${y*-18}px) scale(1.06)`;
  });

  // 3) Replay the dramatic intro.
  document.getElementById('replay').onclick=()=>{
    document.body.classList.remove('run'); void document.body.offsetWidth;
    document.body.classList.add('run');
  };
</script>
</body>
</html>
