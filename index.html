<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction Planner</title>
<link rel="stylesheet" href="cxc.css">
<!--
  No build step. Open this file directly (file://) or serve the folder —
  both work. Classic <script> tags in dependency order, same as cx-portal.

  Shared primitives, copied verbatim from cx-portal so both apps behave the
  same and the merge is a file move:
    icons.js      inline SVG icon system — never emoji
    format.js     escapeHtml + friends
    cx-state.js   cxSkeleton / cxEmpty / cxError
    cx-store.js   observable store (all hot state lives here)
    cx-actions.js event delegation — no inline onclick= anywhere

  Then this app, engine before UI:
    cxc-model.js      durations, window budgets, the packer
    cxc-data.js       entity schema, seed dataset, CRUD
    cxc-timeline.js   Gantt geometry
    cxc-store-local.js the only file that touches localStorage
    cxc-ui-*.js       screens, each registering itself with the shell
-->
</head>
<body>

<div class="cxc-app">

  <aside class="cxc-side">
    <div class="cxc-brand">
      <h1>Construction Planner</h1>
      <p>Installation scope &amp; access forecast</p>
    </div>
    <nav class="cxc-nav" id="cxc-nav" aria-label="Sections"></nav>
  </aside>

  <main class="cxc-main">
    <header class="cxc-topbar">
      <div>
        <h2 id="cxc-title">Plan</h2>
        <div class="cxc-sub" id="cxc-subtitle"></div>
      </div>
      <div class="cxc-topbar-actions">
        <button type="button" class="cxc-btn cxc-secondary" data-action="cxcImport">Import</button>
        <button type="button" class="cxc-btn cxc-secondary" data-action="cxcExport">Export</button>
      </div>
    </header>
    <div class="cxc-view" id="cxc-view"></div>
  </main>

</div>

<div class="cxc-modal-back" id="cxc-modal-back" hidden>
  <div class="cxc-modal" role="dialog" aria-modal="true" aria-labelledby="cxc-modal-title">
    <div class="cxc-modal-head">
      <h3 id="cxc-modal-title"></h3>
      <div class="cxc-spacer"></div>
      <button type="button" class="cxc-iconbtn" aria-label="Close" data-action="cxcModalClose">&times;</button>
    </div>
    <div class="cxc-modal-body" id="cxc-modal-body"></div>
    <div class="cxc-modal-foot">
      <button type="button" class="cxc-btn cxc-secondary" data-action="cxcModalClose">Cancel</button>
      <button type="button" class="cxc-btn" id="cxc-modal-save" data-action="cxcModalSave">Done</button>
    </div>
  </div>
</div>

<div class="cxc-toast" id="cxc-toast" role="status" hidden></div>

<script src="icons.js"></script>
<script src="format.js"></script>
<script src="cx-state.js"></script>
<script src="cx-store.js"></script>
<script src="cx-actions.js"></script>

<script src="cxc-model.js"></script>
<script src="cxc-data.js"></script>
<script src="cxc-timeline.js"></script>
<script src="cxc-store-local.js"></script>

<script src="cxc-ui-shell.js"></script>
<script src="cxc-ui-plan.js"></script>
<script src="cxc-ui-timeline.js"></script>
<script src="cxc-ui-manage.js"></script>
<script src="cxc-boot.js"></script>
</body>
</html>
